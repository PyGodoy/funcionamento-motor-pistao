<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motor de 4 tempos</title><style>
.iso{

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}

  --mt-cut:#2a2a29;--mt-wall:#101010;--mt-back:#0b0b0b;--mt-recess:#0a0a0a;--mt-inner:#0c0c0c;--mt-strip:#2c2c2b;

.mt-stage[data-drag]{cursor:grabbing}
.mt-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.mt-stage>svg,.mt-stage>canvas{display:block;width:100%;height:auto}
.mt-stage>.mt-layer{position:absolute;inset:0;height:100%!important;pointer-events:none}
.mt-cut{fill:var(--mt-cut);stroke:none}
.mt-wall{fill:var(--mt-wall);stroke:none}
.mt-back{fill:var(--mt-back);stroke:none}
.mt-recess{fill:var(--mt-recess);stroke:none}
.mt-inner{fill:var(--mt-inner);stroke:none}

.iso[data-theme="light"] .mt-cav .iso-line[data-tone="lo"]{stroke:#2f2d29}

.mt-crown-glow{fill:var(--mt-fire);stroke:none;opacity:0}
.mt-fb{stroke:none;opacity:0}
.mt-fb-port{stroke:none;fill:var(--mt-cool);opacity:.4}
.mt-fb-port[data-fb-port="ex"]{fill:var(--mt-fire)}
.mt-stage[data-gl] .mt-fb,.mt-stage[data-gl] .mt-fb-port{display:none}
.mt-gl{z-index:1}
.mt-stage>svg.mt-layer{z-index:2}
.mt-panel{display:grid;gap:12px;margin-top:12px}
.mt-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.mt-speed{display:inline-flex;gap:0}
.mt-speed .mt-btn+.mt-btn{margin-left:-1px}
.mt-btn{appearance:none;background:var(--anatomy-card);color:var(--anatomy-text);border:1px solid var(--anatomy-lo);border-radius:0;padding:7px 12px;font:500 11.5px/1 var(--anatomy-mono);letter-spacing:.03em;cursor:pointer}
.mt-btn:hover{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.mt-btn:focus-visible,.mt-step:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.mt-speed .mt-btn[aria-pressed="true"]{color:var(--anatomy-strong);border-color:var(--anatomy-hi);position:relative;z-index:1}
.mt-tl-wrap{background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);cursor:ew-resize;touch-action:pan-y;outline:none}
.mt-tl{display:block;width:100%;height:auto}
.mt-tl-col{fill:transparent;transition:fill .25s}
[data-tl][data-on] .mt-tl-col{fill:color-mix(in srgb,var(--anatomy-hi) 8%,transparent)}
.mt-tl-name{font:600 9.5px var(--anatomy-mono);letter-spacing:.08em;fill:var(--anatomy-muted)}
[data-tl][data-on] .mt-tl-name{fill:var(--anatomy-strong)}
.mt-tl-grid{stroke:var(--anatomy-lo);stroke-width:1}
.mt-tl-area{fill:color-mix(in srgb,var(--mt-fire) 22%,transparent)}
.mt-tl-line{fill:none;stroke:var(--mt-fire);stroke-width:1.4;stroke-linejoin:round}
.mt-tl-lift{fill:var(--mt-cool);opacity:.75}
.mt-tl-lift[data-kind="ex"]{fill:var(--anatomy-mid);opacity:.9}
.mt-tl-spark{stroke:var(--anatomy-hi);stroke-width:1;stroke-dasharray:2 2}
.mt-tl-tag{font:9px var(--anatomy-mono);fill:var(--anatomy-muted)}
.mt-tl-cursor{stroke:var(--anatomy-strong);stroke-width:1}
.mt-tl-dot{fill:var(--anatomy-strong)}
.mt-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt-step{appearance:none;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-content:start;text-align:left;background:var(--anatomy-card);color:var(--anatomy-text);border:1px solid var(--anatomy-faint);border-radius:0;padding:10px;font:inherit;font-size:12.5px;line-height:1.45;cursor:pointer}
.mt-step:hover{border-color:var(--anatomy-mid)}
.mt-step[data-on]{border-color:var(--anatomy-hi);color:var(--anatomy-strong)}
.mt-step-num{font:600 11px/1.5 var(--anatomy-mono);color:var(--anatomy-muted)}
.mt-step[data-on] .mt-step-num{color:var(--anatomy-strong)}
.mt-step-name{font-weight:600;color:var(--anatomy-strong)}
.mt-step-text{grid-column:1/-1}
.mt-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:640px){.mt-steps{grid-template-columns:1fr 1fr}}

uniform vec4 uCam;

float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}

float noise3(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);

const GLSL_TURN = `uniform vec3 uGroupX;
uniform vec3 uGroupY;
uniform vec3 uGroupZ;
uniform vec3 uGroupT;
uniform vec3 uCoverEdge[60];
uniform float uCoverCount[6];
vec3 toGroup(vec3 p){vec3 q=p-uGroupT;return vec3(dot(q,uGroupX),dot(q,uGroupY),dot(q,uGroupZ));}
vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}
vec3 from${name}(vec3 g){return ${prefix}T+g.x*${prefix}X+g.y*${prefix}Y+g.z*${prefix}Z;}
vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}
`;

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;
  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}
// Modelo puro do motor monocilíndrico de 4 tempos. Tudo que a figura mostra sai daqui.
// theta é o ângulo do virabrequim em graus, de 0 a 720: 0 = PMS no início da admissão, 360 = PMS da combustão.

const ENGINE = {
  bore: 68,
  stroke: 54,
  rod: 92,
  ratio: 8.5,
  crownAbovePin: 26,
  deck: 147,
  lift: 7.5,
  ivo: -10,
  ivc: 225,
  evo: 495,
  evc: 730,
  spark: 340,
  burnStart: 345,
  burnLength: 52,
  intakeBar: 0.94,
  exhaustBar: 1.06,
  ambientBar: 1.0,
  polytropic: 1.3,
  heatJ: 400,
};

const RAD = Math.PI / 180;
const crankRadius = ENGINE.stroke / 2;
const boreArea = (Math.PI / 4) * ENGINE.bore * ENGINE.bore;
const displacement = boreArea * ENGINE.stroke;
const clearance = displacement / (ENGINE.ratio - 1);

const wrap = (theta) => ((theta % 720) + 720) % 720;

// Altura do pino do pistão acima do eixo do virabrequim.
const pinHeight = (theta) => {
  const a = theta * RAD;
  const s = crankRadius * Math.sin(a);
  return crankRadius * Math.cos(a) + Math.sqrt(ENGINE.rod * ENGINE.rod - s * s);
};
const crownHeight = (theta) => pinHeight(theta) + ENGINE.crownAbovePin;
const travel = (theta) => ENGINE.rod + crankRadius - pinHeight(theta);
const volume = (theta) => clearance + boreArea * travel(theta);
const rodAngle = (theta) => Math.asin((crankRadius * Math.sin(theta * RAD)) / ENGINE.rod);
const pinAt = (theta) => [crankRadius * Math.sin(theta * RAD), crankRadius * Math.cos(theta * RAD)];

// Braço de alavanca efetivo: quanto de giro cada mm de pistão produz (mm por radiano).
const leverArm = (theta) => (travel(theta + 0.05) - travel(theta - 0.05)) / (0.1 * RAD);

const liftShape = (x) => (Math.abs(x) >= 1 ? 0 : Math.pow(Math.cos((x * Math.PI) / 2), 2));
const signedFrom = (theta, centre) => ((((theta - centre) % 720) + 1080) % 720) - 360;

const intakeCentre = (ENGINE.ivo + ENGINE.ivc) / 2;
const exhaustCentre = (ENGINE.evo + ENGINE.evc) / 2;
const intakeHalf = (ENGINE.ivc - ENGINE.ivo) / 2;
const exhaustHalf = (ENGINE.evc - ENGINE.evo) / 2;
const intakeLift = (theta) => ENGINE.lift * liftShape(signedFrom(theta, intakeCentre) / intakeHalf);
const exhaustLift = (theta) => ENGINE.lift * liftShape(signedFrom(theta, exhaustCentre) / exhaustHalf);

// Fração queimada: função de Wiebe.
const burned = (theta) => {
  const x = (wrap(theta) - ENGINE.burnStart) / ENGINE.burnLength;
  if (x <= 0) return 0;
  return 1 - Math.exp(-5 * Math.pow(Math.min(x, 1.4), 3));
};

// Ciclo: integração da primeira lei em passos de 0,5°, de IVC até a abertura do escape.
function buildCycle(step = 0.5) {
  const n = ENGINE.polytropic;
  const count = Math.round(720 / step);
  const pressure = new Float64Array(count + 1);
  const start = ENGINE.ivc;
  const openAt = ENGINE.evo;
  const closedV = volume(start);
  let p = ENGINE.intakeBar;
  const closed = new Map();
  for (let theta = start; theta <= openAt + 1e-9; theta += step) {
    closed.set(Math.round(theta / step), p);
    const v0 = volume(theta);
    const v1 = volume(theta + step);
    const dq = ENGINE.heatJ * (burned(theta + step) - burned(theta));
    const mid = (v0 + v1) / 2;
    p += -n * (p / mid) * (v1 - v0) + ((n - 1) / (mid * 1e-9)) * dq * 1e-5;
  }
  const pOpen = closed.get(Math.round(openAt / step));
  for (let index = 0; index <= count; index++) {
    const theta = index * step;
    let value;
    if (theta < start) {
      const swap = (theta - ENGINE.ivo - 0) / (ENGINE.evc - 720 - ENGINE.ivo);
      const s = Math.min(1, Math.max(0, swap));
      value = ENGINE.exhaustBar + (ENGINE.intakeBar - ENGINE.exhaustBar) * (s * s * (3 - 2 * s));
    } else if (theta <= openAt) {
      value = closed.get(index);
    } else {
      const blow = Math.exp(-(theta - openAt) / 16);
      value = ENGINE.exhaustBar + (pOpen - ENGINE.exhaustBar) * blow;
      if (theta > 710) {
        const s = (theta - 710) / 20;
        value += (ENGINE.intakeBar - ENGINE.exhaustBar) * (s * s * (3 - 2 * s));
      }
    }
    pressure[index] = value;
  }
  const trapped = (ENGINE.intakeBar * 1e5 * closedV * 1e-9) / (287 * 340);
  const at = (table, theta) => {
    const x = wrap(theta) / step;
    const i = Math.floor(x);
    const t = x - i;
    return table[i] + (table[Math.min(i + 1, count)] - table[i]) * t;
  };
  const pressureAt = (theta) => at(pressure, theta);
  const tOpen = (pressureAt(openAt) * 1e5 * volume(openAt) * 1e-9) / (trapped * 287);
  const blown = (w) => Math.max(760, tOpen * Math.pow(pressureAt(w) / pressureAt(openAt), (n - 1) / n));
  const tEnd = blown(720);
  const temperatureAt = (theta) => {
    const w = wrap(theta);
    if (w >= start && w <= openAt) return (pressureAt(w) * 1e5 * volume(w) * 1e-9) / (trapped * 287);
    if (w > openAt) return blown(w);
    const s = Math.min(1, w / 120);
    return tEnd + (335 - tEnd) * (s * s * (3 - 2 * s));
  };
  const forceAt = (theta) => (pressureAt(theta) - ENGINE.ambientBar) * 0.1 * boreArea;
  const torqueAt = (theta) => (forceAt(theta) * leverArm(theta)) / 1000;
  return { step, pressure, pressureAt, temperatureAt, forceAt, torqueAt, trapped };
}

];
const strokeOf = (theta) => STROKES[Math.min(3, Math.floor(wrap(theta) / 180))];

// Em relação ao ponto morto mais próximo que importa para o leitor.
const positionText = (theta) => {
  const w = wrap(theta);
  const fold = w % 360;
  const fromTop = fold <= 180 ? fold : 360 - fold;
  if (fromTop < 0.5) return "no PMS";
  if (fromTop > 179.5) return "no PMI";
  if (fromTop <= 90) return `${Math.round(fromTop)}° ${fold <= 180 ? "após" : "antes do"} PMS`;
  return `${Math.round(180 - fromTop)}° ${fold <= 180 ? "antes do" : "após"} PMI`;

const pathFrom = (xs, ys, closed) => {

function solidPart(name) {

// Prisma ao longo de y, reconstruído a cada quadro: mesmos tons do kit, sem precisar de depthOf.
function prism(part, ring, cx, cz, rotation, y0, y1) {
  const c = Math.cos(rotation);
  const s = Math.sin(rotation);
  const n = ring.length;
  const hx = new Array(n);
  const hy = new Array(n);
  const lx = new Array(n);
  const ly = new Array(n);
  const wx = new Array(n);
  const wz = new Array(n);
  const hull = [];
  for (let i = 0; i < n; i++) {
    wx[i] = cx + ring[i][0] * c - ring[i][1] * s;
    wz[i] = cz + ring[i][0] * s + ring[i][1] * c;
    hx[i] = sx(wx[i], y1);
    hy[i] = sy(wx[i], y1, wz[i]);
    lx[i] = sx(wx[i], y0);
    ly[i] = sy(wx[i], y0, wz[i]);
    hull.push([hx[i], hy[i]], [lx[i], ly[i]]);
  }
  const buckets = ["", "", "", ""];
  let crease = "";
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = wx[j] - wx[i];
    const dz = wz[j] - wz[i];
    const length = Math.hypot(dx, dz) || 1;
    const nx = dz / length;
    const nz = -dx / length;
    if (nx * VIEW[0] + nz * VIEW[2] <= 1e-6) continue;
    const tone = toneBand(nx * LIGHT[0] + nz * LIGHT[2]);
    buckets[tone] += `M${f(lx[i])} ${f(ly[i])}L${f(lx[j])} ${f(ly[j])}L${f(hx[j])} ${f(hy[j])}L${f(hx[i])} ${f(hy[i])}Z`;
    crease += `M${f(hx[i])} ${f(hy[i])}L${f(hx[j])} ${f(hy[j])}`;
  }
  const edge = convexHull(hull);
  const outline = pathFrom(edge.map((p) => p[0]), edge.map((p) => p[1]), true);
  part.fill.setAttribute("d", outline);
  part.edge.setAttribute("d", outline);
  buckets.forEach((d, tone) => part.shades[tone].setAttribute("d", d));
  part.top.setAttribute("d", pathFrom(hx, hy, true));
  part.crease.setAttribute("d", crease);
}

function coilPaths(x, z0, z1, radius) {
  const turns = 5.5;
  const count = Math.round(turns * 18);
  let back = "";
  let near = "";
  let wasFront = null;
  let run = "";
  for (let i = 0; i <= count; i++) {
    const share = i / count;
    const a = share * turns * Math.PI * 2;
    const nx = Math.cos(a);
    const ny = Math.sin(a);
    const z = z0 + (z1 - z0) * share;
    const px = sx(x + radius * nx, radius * ny);
    const py = sy(x + radius * nx, radius * ny, z);
    const facing = nx * VIEW[0] + ny * VIEW[1] > 0;
    if (wasFront === null) wasFront = facing;
    if (facing !== wasFront) {
      run += `L${f(px)} ${f(py)}`;
      if (wasFront) near += run;
      else back += run;
      run = `M${f(px)} ${f(py)}`;
      wasFront = facing;
    } else run += `${run ? "L" : "M"}${f(px)} ${f(py)}`;
  }
  if (wasFront) near += run;
  else back += run;
  return { back, near };
}

function drawMechanism(theta) {
  const [px, pz] = pinAt(theta);
  const pinZ = pinHeight(theta);
  spin("disc", -theta);
  spin("crank", -theta);
  slide("pin", shift(px, pz));
  slide("piston", shift(0, pinZ - pinHeight(0)));
  const lean = Math.asin(px / ENGINE.rod);
  prism(rodPart, D.rodRing, px, pz, lean, -D.rod.half, D.rod.half);
  rodArt.setAttribute("transform", `matrix(${f(cam.sinA * cam.k)} ${f(cam.cosA * cam.sinE * cam.k)} 0 ${f(-cam.cosE * cam.k)} ${f(sx(px, D.rod.half))} ${f(sy(px, D.rod.half, pz))}) rotate(${f((lean * 180) / Math.PI)})`);
  for (const item of D.cams) {
    const lift = liftOf[item.id](theta);
    spin(`cam-${item.id}`, item.phase + theta / 2);
    spin(`shaft-${item.id}`, theta / 2);
    prism(lobes[item.id], D.lobes[item.id], item.x, item.z, (theta / 2) * (Math.PI / 180), -6, 6);
    slide(`tappet-${item.id}`, shift(0, lift));
    slide(`valve-${item.id}`, shift(0, -lift));
    const sinTilt = (D.rocker.pushTop - D.rocker.valveTip + 2 * lift) / (2 * D.rocker.arm);
    const tilt = Math.asin(sinTilt) * item.side;
    prism(rockers[item.id], D.rocker.ring, item.side * D.rocker.x, D.rocker.z, tilt, -6, 6);
    const coil = coilPaths(item.side * D.valve.x, D.valve.seatTop, D.valve.retainer - lift, D.valve.r);
    coils[item.id].back.setAttribute("d", coil.back);
    coils[item.id].front.setAttribute("d", coil.near);
  }
}

function drawGauge(bar) {
  const angle = ((-135 + (Math.min(bar, D.gauge.max) / D.gauge.max) * 270) * Math.PI) / 180;
  const s = Math.sin(angle);
  const c = -Math.cos(angle);
  needle.setAttribute("d", lineOnTop([D.gauge.x - s * 4, D.gauge.y - c * 4], [D.gauge.x + s * D.gauge.r, D.gauge.y + c * D.gauge.r], D.gauge.z + 0.2, D.P));
}

function drawPanel(theta, bar) {
  const stroke = strokeOf(theta);
  cursor.setAttribute("transform", `translate(${f((theta / 720) * 600)} 0)`);
  cursorDot.setAttribute("cy", f(92 - (Math.min(bar, 40) / 40) * 66));
  const text = `${stroke.id} ${stroke.name} · ${positionText(theta)} · ${bar < 9.95 ? bar.toFixed(1).replace(".", ",") : Math.round(bar)} bar`;
  if (readout.textContent !== text) readout.textContent = text;
  if (shownStroke !== stroke.id) {
    shownStroke = stroke.id;
    steps.forEach((node, index) => node.toggleAttribute("data-on", index + 1 === stroke.id));
    columns.forEach((node, index) => node.toggleAttribute("data-on", index + 1 === stroke.id));
    liveText.textContent = stroke.name;
    stage.setAttribute("aria-valuetext", `Tempo ${stroke.id}: ${stroke.name}`);
  }
  stage.setAttribute("aria-valuenow", String(Math.round(theta)));
}

  float inDuct=duct*left;
  float ni=fbm2(vec2(q.x*.085+uFlowIn,q.y*.11));
  gas=over(ink(vec3(.60,.78,1.),(1.-exp(-(.34+.5*ni+.5*uIn*ni)*1.2))*inDuct),gas);

  vec2 toValve=normalize(vec2(17.,156.)-q+vec2(.001));
  vec2 ex=q-toValve*uFlowEx*5.+vec2(0.,-uDrift*2.);
  float ns=fbm2(ex*.07+vec2(5.3,1.9));
  float t=uHeat*(.6+.42*ns)+.1*exp(-d*d/1400.)*uHeat;
  vec3 hot=fireInk(t);
  float soot=1.-smoothstep(.03,.2,uHeat);
  vec3 body=mix(hot,vec3(.34,.32,.31),soot*.85);
  float e=cylinder*burnt*uSmoke*(.5+.8*ns)*(.42+1.5*uHeat);
  gas=over(ink(body,1.-exp(-e*3.)),gas);
  float rim=cylinder*exp(-pow((dd-uRadius)/2.8,2.))*uFront;
  gas=over(ink(vec3(.70,.84,1.),1.-exp(-rim*1.6)),gas);

  float exDuct=duct*(1.-left);
  float nx=fbm2(vec2(q.x*.09-uFlowEx,q.y*.12));
  float flow=uEx*(.55+.9*nx);
  vec3 outGas=mix(vec3(.34,.32,.31),fireInk(uHeat*(.9+.5*nx)),smoothstep(.02,.16,uHeat)*uEx);
  gas=over(ink(outGas,(1.-exp(-(flow+.16*nx)*2.1))*exDuct),gas);

  float gap=length(q-vec2(0.,152.6));
  float spark=uSpark*(exp(-gap*gap/5.)+.5*exp(-gap*gap/90.));
  gas=over(ink(vec3(.82,.90,1.),1.-exp(-spark*3.5)),gas);

  gas*=mask;
  gas.rgb=min(gas.rgb,vec3(gas.a));
  float dither=(hash12(gl_FragCoord.xy)+hash12(gl_FragCoord.yx*1.37)-1.)/255.;
  gl_FragColor=max(gas+vec4(dither)*smoothstep(0.,1.5/255.,gas.a),vec4(0.));
}`;
const layer = glLayer({ canvas: stage.querySelector(".mt-gl"), fragment: FRAGMENT, view: [D.W, D.H], camera: D.camera, uniforms: ["uCrown", "uFill", "uDense", "uWarm", "uRadius", "uConsume", "uFront", "uHeat", "uSmoke", "uSpark", "uSwirl", "uDrift", "uIn", "uEx", "uFlowIn", "uFlowEx"] });
if (layer) stage.setAttribute("data-gl", "");
const crownGlow = front.querySelector("[data-crown-glow]");
const fallback = document.querySelector("[data-fallback]");
const portExhaust = document.querySelector('[data-fb-port="ex"]');
const volumeAtClose = volume(ENGINE.ivc);
const fillSpan = volume(ENGINE.ivc) - clearance;
const clamp01 = (value) => Math.min(1, Math.max(0, value));
const SMOKE_LEFT = 0.6 * Math.pow(volume(720) / volume(540), 0.55);

// Tudo é função do ângulo: arrastar para trás desfaz a chama sem nenhum salto.
function gasState(theta, unwrapped) {
  const w = wrap(theta);
  const T = Cycle.temperatureAt(w);
  const x = burned(w);
  const compressed = w >= ENGINE.ivc && w < 420;
  const fill = w < ENGINE.ivc ? clamp01((volume(w) - clearance) / fillSpan) : w < 420 ? 1 : 0;
  const dense = compressed ? clamp01((volumeAtClose / volume(w) - 1) / (ENGINE.ratio - 1)) : 0;
  const warm = compressed ? clamp01((T - 335) / 330) : 0;
  const after = w >= ENGINE.burnStart;
  const opened = smooth(395, 425, w);
  const radius = after ? 74 * Math.pow(x, 0.6) + 500 * opened : w < 110 ? 600 : 0;
  let smoke = 0;
  if (w >= ENGINE.burnStart) smoke = 1;
  if (w > ENGINE.evo) smoke = 1 - 0.4 * smooth(ENGINE.evo, 540, w);
  if (w > 540) smoke *= Math.pow(volume(w) / volume(540), 0.55);
  if (w < 90) smoke = SMOKE_LEFT * (1 - smooth(4, 80, w));
  const heat = clamp01((T - 800) / 1600);
  const age = w - ENGINE.spark;
  const spark = age > 0 && age < 60 ? burst(age, 1.6, 7) : 0;
  const sinceIntake = unwrapped - ENGINE.ivo;
  const sinceExhaust = unwrapped - ENGINE.evo;
  const intakeFlow = Math.floor(sinceIntake / 720) + clamp01(wrap(sinceIntake) / (ENGINE.ivc - ENGINE.ivo));
  const exhaustFlow = Math.floor(sinceExhaust / 720) + clamp01(wrap(sinceExhaust) / (ENGINE.evc - ENGINE.evo));
  return {
    uCrown: crownHeight(w),
    uFill: fill,
    uDense: dense,
    uWarm: warm,
    uRadius: radius,
    uConsume: after ? 1 : 0,
    uFront: clamp01(4 * x * (1 - x)),
    uHeat: heat,
    uSmoke: smoke,
    uSpark: spark,
    uSwirl: w * 0.0087,
    uDrift: (w < 180 ? w + 720 : w) * 0.0087,
    uIn: intakeLift(w) / ENGINE.lift,
    uEx: exhaustLift(w) / ENGINE.lift,
    uFlowIn: intakeFlow * 3,
    uFlowEx: exhaustFlow * 3,
  };
}

function drawGas(theta) {
  const state = gasState(theta, theta);
  const glow = state.uHeat * Math.min(1, state.uSmoke) * clamp01(state.uRadius / 40);
  crownGlow.style.opacity = f(glow * 0.26);
  if (layer) {
    layer.draw(state, 0);
    return;
  }
  const crown = state.uCrown;
  fallback.setAttribute("d", pathFrom(D.fb.x.map((u) => sx(u, 0)), D.fb.x.map((u, index) => sy(u, 0, index < 2 ? crown - 4 : D.fb.top)), true));
  const fire = state.uHeat * state.uSmoke;
  fallback.style.fill = fire > 0.02 ? "var(--mt-fire)" : "var(--mt-cool)";
  fallback.style.opacity = f(fire > 0.02 ? 0.25 + 0.7 * Math.min(1, fire * 1.4) : 0.12 + 0.45 * state.uFill * (0.4 + state.uDense));
  portExhaust.style.opacity = f(0.1 + 0.6 * state.uEx);
}

let angle = 372;
let target = angle;
let period = 8;
let playing = !still.matches;
let held = false;
let visible = false;
let frame = 0;
let last = 0;
let idleTimer = 0;
let drawn = -1;

function draw(theta) {
  const w = wrap(theta);
  const bar = Cycle.pressureAt(w);
  drawMechanism(w);
  drawGauge(bar);
  drawPanel(w, bar);
  drawGas(theta);
  drawn = w;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (playing && !held) {
    angle += (dt * 720) / period;
    target = angle;
  } else {
    angle = still.matches ? target : angle + (target - angle) * (1 - Math.exp(-dt / 0.1));
    if (Math.abs(target - angle) < 0.02) angle = target;
  }
  if (wrap(angle) !== drawn) draw(angle);
  const moving = (playing && !held) || angle !== target;
  frame = visible && moving ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

const holdFor = (seconds = 3.6) => {
  held = true;
  clearTimeout(idleTimer);
  if (playing) idleTimer = setTimeout(() => {
    held = false;
    target = angle;
    run();
  }, seconds * 1000);
};
const steer = (next, seconds) => {
  target = next;
  holdFor(seconds);
  run();
};
const nearest = (wanted) => {
  const base = angle - wrap(angle);
  return [base + wanted - 720, base + wanted, base + wanted + 720].reduce((best, value) => (Math.abs(value - angle) < Math.abs(best - angle) ? value : best));
};

let dragFrom = null;
stage.addEventListener("pointerdown", (event) => {
  dragFrom = { x: event.clientX, angle: angle, id: event.pointerId };
  target = angle;
  stage.setAttribute("data-drag", "");
  stage.setPointerCapture(event.pointerId);
  held = true;
  clearTimeout(idleTimer);
});
stage.addEventListener("pointermove", (event) => {
  if (!dragFrom) return;
  const scale = 720 / stage.getBoundingClientRect().width;
  target = dragFrom.angle + (event.clientX - dragFrom.x) * scale;
  run();
});
const endDrag = () => {
  if (!dragFrom) return;
  dragFrom = null;
  stage.removeAttribute("data-drag");
  holdFor();
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

const timelineWrap = document.querySelector(".mt-tl-wrap");
let scrubbing = false;
const scrub = (event) => {
  const box = timelineWrap.getBoundingClientRect();
  const share = Math.min(0.9999, Math.max(0, (event.clientX - box.left) / box.width));
  target = nearest(share * 720);
  held = true;
  clearTimeout(idleTimer);
  run();
};
timelineWrap.addEventListener("pointerdown", (event) => {
  scrubbing = true;
  timelineWrap.setPointerCapture(event.pointerId);
  scrub(event);
});
timelineWrap.addEventListener("pointermove", (event) => scrubbing && scrub(event));
const endScrub = () => {
  if (!scrubbing) return;
  scrubbing = false;
  holdFor();
};
timelineWrap.addEventListener("pointerup", endScrub);
timelineWrap.addEventListener("pointercancel", endScrub);

const STROKE_MID = [90, 270, 450, 630];
const jump = (index) => steer(nearest(STROKE_MID[index]), 6);
steps.forEach((node, index) => node.addEventListener("click", () => jump(index)));

const playButton = document.querySelector("[data-play]");
const playLabel = document.querySelector("[data-play-label]");
const setPlaying = (value) => {
  playing = value;
  held = false;
  clearTimeout(idleTimer);
  target = angle;
  playButton.setAttribute("aria-pressed", String(value));
  playLabel.textContent = value ? "Pausar" : "Ligar o motor";
  run();
};
playButton.addEventListener("click", () => setPlaying(!playing));
document.querySelectorAll("[data-speed]").forEach((node) =>
  node.addEventListener("click", () => {
    period = Number(node.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach((other) => other.setAttribute("aria-pressed", String(other === node)));
  }),
);
stage.addEventListener("keydown", (event) => {
  const stepSize = event.shiftKey ? 30 : 5;
  const from = held || !playing ? target : angle;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") steer(from + stepSize);
  else if (event.key === "ArrowLeft" || event.key === "ArrowDown") steer(from - stepSize);
  else if (event.key === "Home") steer(nearest(0));
  else if (["1", "2", "3", "4"].includes(event.key)) jump(Number(event.key) - 1);
  else if (event.key === " ") setPlaying(!playing);
  else return;
  event.preventDefault();
});
matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => setPlaying(!still.matches));
setPlaying(playing);
draw(angle);
addEventListener("resize", () => draw(angle));
window.__motor = { set(theta) { playing = false; held = false; clearTimeout(idleTimer); angle = target = theta; draw(theta); return readout.textContent; } };
</script></body></html>
